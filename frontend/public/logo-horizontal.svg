<svg width="600" height="150" viewBox="0 0 600 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- BeatPush Horizontal Logo: Icon + Text -->
  
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="50%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#84cc16"/>
    </linearGradient>
  </defs>
  
  <!-- Icon (scaled and positioned) -->
  <g transform="translate(20, 25) scale(1)">
    <!-- Bottom wave -->
    <path d="M 20 65 Q 30 55, 40 65 Q 50 75, 60 65 Q 70 55, 80 65" 
          stroke="url(#logoGradient)" 
          stroke-width="6" 
          stroke-linecap="round"
          fill="none"/>
    
    <!-- Top leaves -->
    <path d="M 30 40 Q 25 30, 23 20 Q 27 25, 30 23 Q 29 30, 30 40" 
          fill="url(#logoGradient)"/>
    
    <path d="M 50 30 Q 47 18, 45 8 Q 48 15, 50 12 Q 49 20, 50 30 M 50 30 Q 53 18, 55 8 Q 52 15, 50 12 Q 51 20, 50 30" 
          fill="url(#logoGradient)"/>
    
    <path d="M 70 40 Q 75 30, 77 20 Q 73 25, 70 23 Q 71 30, 70 40" 
          fill="url(#logoGradient)"/>
    
    <!-- Stems -->
    <path d="M 30 40 Q 32 50, 35 58" 
          stroke="url(#logoGradient)" 
          stroke-width="4" 
          stroke-linecap="round"
          fill="none"/>
    
    <path d="M 50 30 Q 50 45, 50 58" 
          stroke="url(#logoGradient)" 
          stroke-width="4" 
          stroke-linecap="round"
          fill="none"/>
    
    <path d="M 70 40 Q 68 50, 65 58" 
          stroke="url(#logoGradient)" 
          stroke-width="4" 
          stroke-linecap="round"
          fill="none"/>
  </g>
  
  <!-- Text: BeatPush -->
  <text x="160" y="95" 
        font-family="'Inter', 'Helvetica', sans-serif" 
        font-size="56" 
        font-weight="700" 
        fill="url(#logoGradient)">
    BeatPush
  </text>
  
  <!-- Tagline (optional, can be hidden) -->
  <text x="162" y="120" 
        font-family="'Inter', 'Helvetica', sans-serif" 
        font-size="16" 
        font-weight="400" 
        fill="#059669" 
        opacity="0.7">
    Where African Music Grows
  </text>
  
</svg>
