<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- BeatPush Logo: "The Growth Wave" -->
  <!-- Concept: Soundwave transforming into African leaves, representing music growing into nature -->
  
  <defs>
    <!-- Green gradient: Forest to Lime -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#84cc16;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow for depth -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Circular background for app icon -->
  <circle cx="100" cy="100" r="95" fill="url(#mainGradient)" opacity="0.1"/>
  
  <!-- The Growth Wave Symbol -->
  <g filter="url(#shadow)">
    
    <!-- Bottom wave (soundwave) - represents music/beats -->
    <path d="M 40 120 Q 50 110, 60 120 T 80 120" 
          stroke="url(#mainGradient)" 
          stroke-width="8" 
          stroke-linecap="round"
          fill="none"/>
    
    <!-- Middle wave (transitioning) -->
    <path d="M 45 100 Q 58 85, 70 100 Q 82 115, 95 100 Q 108 85, 120 100" 
          stroke="url(#mainGradient)" 
          stroke-width="8" 
          stroke-linecap="round"
          fill="none"/>
    
    <!-- Top elements (leaves) - represents growth/Africa -->
    
    <!-- Left leaf -->
    <path d="M 65 75 Q 55 65, 50 55 Q 55 60, 60 58 Q 58 65, 65 75" 
          fill="url(#mainGradient)"/>
    
    <!-- Center leaf (largest) -->
    <path d="M 100 55 Q 88 40, 80 25 Q 90 32, 95 28 Q 93 38, 100 55 M 100 55 Q 112 40, 120 25 Q 110 32, 105 28 Q 107 38, 100 55" 
          fill="url(#mainGradient)"/>
    
    <!-- Right leaf -->
    <path d="M 135 75 Q 145 65, 150 55 Q 145 60, 140 58 Q 142 65, 135 75" 
          fill="url(#mainGradient)"/>
    
    <!-- Connecting stems (soundwave becoming organic) -->
    <path d="M 65 75 Q 70 85, 75 95" 
          stroke="url(#mainGradient)" 
          stroke-width="6" 
          stroke-linecap="round"
          fill="none"/>
    
    <path d="M 100 55 Q 100 70, 100 95" 
          stroke="url(#mainGradient)" 
          stroke-width="6" 
          stroke-linecap="round"
          fill="none"/>
    
    <path d="M 135 75 Q 130 85, 125 95" 
          stroke="url(#mainGradient)" 
          stroke-width="6" 
          stroke-linecap="round"
          fill="none"/>
    
  </g>
  
  <!-- Optional: Play button circle in center (can be removed for simpler version) -->
  <circle cx="100" cy="140" r="15" fill="url(#mainGradient)" opacity="0.2"/>
  <polygon points="96,133 96,147 108,140" fill="url(#mainGradient)"/>
  
</svg>
